<style>
:root{
  --zemin:#05070a;
  --panel:#0e1117;
  --kart:#151a24;
  --cizgi:rgba(255,255,255,.07);
  --metin:#e0e6ed;
  --soluk:#8f9cae;
  --camgobegi:#00ffcc;
  --mavi:#00a2ff;
  --ates:#ff5533;
  --sari:#ffcc33;
  --mono:"SF Mono",ui-monospace,"Courier New",monospace;
  /* temaya bağlı */
  --gosterge-bg:rgba(15,19,26,.85);
  --btn-zemin:#12161f;
  --tuval-1:#11151f;
  --tuval-2:#05070a;
  --tepkime-bg:rgba(10,14,20,.92);
  --tepkime-cizgi:rgba(0,255,204,.16);
  --denklem-renk:#00ffcc;
  --ph-renk:#00ffcc;
  --isi-renk:#ff5533;
  --hacim-renk:#00a2ff;
  --katman-bg:rgba(3,5,8,.86);
  --giris-1:rgba(0,162,255,.20);
  --giris-2:rgba(255,85,51,.14);
}
body.aydinlik{
  --zemin:#eef1f5;
  --panel:#ffffff;
  --kart:#f4f6f9;
  --cizgi:rgba(16,26,40,.11);
  --metin:#131a23;
  --soluk:#5d6875;
  --gosterge-bg:#f4f6f9;
  --btn-zemin:#f0f3f7;
  --tuval-1:#ffffff;
  --tuval-2:#dfe5ee;
  --tepkime-bg:#ffffff;
  --tepkime-cizgi:rgba(0,130,110,.28);
  --denklem-renk:#007764;
  --ph-renk:#007764;
  --isi-renk:#c8380f;
  --hacim-renk:#0069b8;
  --katman-bg:rgba(226,232,240,.92);
  --giris-1:rgba(0,140,220,.14);
  --giris-2:rgba(255,120,60,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
button,select,.rozet{-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{
  background:var(--zemin);color:var(--metin);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}

/* ---------- giriş ekranı ---------- */
#giris{
  position:fixed;inset:0;z-index:9999;
  background:
    radial-gradient(circle at 50% 32%, var(--giris-1) 0%, transparent 60%),
    radial-gradient(circle at 50% 85%, var(--giris-2) 0%, transparent 55%),
    var(--zemin);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px 22px;transition:opacity .45s ease;
}
#giris.kapanan{opacity:0;pointer-events:none}
#giris .marka-logo{width:150px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.85));margin-bottom:14px}
#giris .marka-logo[data-yok]{display:none}
#giris h1{
  font-size:15px;font-weight:800;letter-spacing:4.5px;text-transform:uppercase;
  color:var(--metin);margin-bottom:6px;
}
#giris .alt{font-size:12.5px;color:var(--soluk);letter-spacing:.4px;margin-bottom:24px}
#giris .halka{
  width:150px;height:150px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(255,255,255,.18);box-shadow:0 14px 40px rgba(0,0,0,.9);
  margin-bottom:22px;background:rgba(255,255,255,.03);
}
#giris .halka img{width:100%;height:100%;object-fit:cover;display:block}
#giris .slogan{
  font-size:13px;color:var(--denklem-renk);letter-spacing:.5px;
  margin-bottom:30px;max-width:320px;line-height:1.5;
}
.btn-baslat{
  background:rgba(10,15,25,.85);border:1.5px solid rgba(0,162,255,.6);color:#bceeff;
  padding:16px 46px;font-size:12px;font-weight:800;letter-spacing:2.5px;
  border-radius:26px;cursor:pointer;
  box-shadow:0 10px 30px rgba(0,162,255,.22), inset 0 1px 1px rgba(255,255,255,.14);
  transition:transform .15s, background .15s;
}
.btn-baslat:active{transform:scale(.96);background:rgba(0,162,255,.28)}
.btn-baslat:focus-visible{outline:2px solid var(--camgobegi);outline-offset:3px}

/* ---------- göstergeler ---------- */
.gosterge-satiri{display:flex;gap:8px;padding:12px 12px 6px;background:var(--panel)}
.gosterge{
  flex:1;background:var(--gosterge-bg);border:1px solid var(--cizgi);
  border-radius:12px;padding:9px 6px;text-align:center;
  font-size:9.5px;font-weight:700;color:var(--soluk);letter-spacing:.7px;text-transform:uppercase;
}
.gosterge span{display:block;font-family:var(--mono);font-size:17px;font-weight:700;margin-top:3px}
#ph-deger{color:var(--ph-renk)}
#sicaklik-deger{color:var(--isi-renk)}
#hacim-deger{color:var(--hacim-renk)}

/* ---------- araç düğmeleri ---------- */
.arac-satiri{display:flex;gap:8px;padding:0 12px 8px;background:var(--panel)}
.btn-arac{
  flex:1;font-size:11.5px;padding:10px 4px;font-weight:700;border-radius:10px;
  background:var(--btn-zemin);border:1px solid var(--cizgi);color:var(--soluk);cursor:pointer;
  transition:background .15s,color .15s;
}
.btn-arac.acik-kapak{background:linear-gradient(135deg,#00ffcc,#00aa88);color:#05070a;border-color:transparent}
.btn-arac.acik-bek{background:linear-gradient(135deg,#ff5533,#aa2200);color:#fff;border-color:transparent}
.btn-arac:focus-visible{outline:2px solid var(--camgobegi);outline-offset:2px}
.btn-tema{flex:0 0 52px;font-size:16px;padding:10px 0}

/* ---------- tuval ---------- */
.tuval-alani{
  flex:1;min-height:0;display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at center,var(--tuval-1) 0%,var(--tuval-2) 92%);
}
canvas{max-width:100%;max-height:100%;display:block}

/* ---------- tepkime ekranı ---------- */
#tepkime{
  background:var(--tepkime-bg);border:1px solid var(--tepkime-cizgi);
  margin:0 12px 6px;border-radius:11px;padding:10px 13px;text-align:center;
}
#denklem{
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--denklem-renk);
  line-height:1.45;word-break:break-word;
}
#denklem.uyari{color:var(--ates)}
#aciklama{font-size:11.5px;color:var(--soluk);margin-top:5px;line-height:1.45}

/* ---------- kontroller ---------- */
.kontroller{
  background:var(--panel);padding:13px 14px 18px;
  display:flex;flex-direction:column;gap:9px;
  border-top:1px solid var(--cizgi);border-radius:22px 22px 0 0;
}
.satir{display:flex;gap:8px}
select{
  flex:1;min-width:0;background:var(--kart);color:#fff;border:1px solid var(--cizgi);
  padding:12px 10px;font-size:13.5px;font-weight:600;border-radius:11px;
  outline:none;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--soluk) 50%),linear-gradient(135deg,var(--soluk) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;
}
select:focus-visible{outline:2px solid var(--camgobegi);outline-offset:1px}
select.dar{flex:0 0 96px}
.btn-ekle{
  background:linear-gradient(135deg,#00ffcc,#0088cc);color:#05070a;font-weight:800;
  padding:0 20px;border:none;border-radius:11px;cursor:pointer;font-size:13px;letter-spacing:.5px;
}
.btn-ekle:active{transform:scale(.97)}
.btn-ikincil{
  flex:1;background:var(--btn-zemin);border:1px solid var(--cizgi);color:var(--soluk);
  padding:11px;font-weight:700;border-radius:11px;cursor:pointer;font-size:12px;
}
.btn-sil{
  flex:1;background:linear-gradient(135deg,#ff3b30,#7a0d06);border:none;color:#fff;
  padding:11px;font-weight:700;border-radius:11px;cursor:pointer;font-size:12px;
}
button:focus-visible{outline:2px solid var(--camgobegi);outline-offset:2px}

/* ---------- kayıt penceresi ---------- */
#kayit-katman{
  position:fixed;inset:0;z-index:900;background:var(--katman-bg);
  display:none;flex-direction:column;padding:18px;
}
#kayit-katman.acik{display:flex}
#kayit-kutu{
  background:var(--panel);border:1px solid var(--cizgi);border-radius:16px;
  flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
}
#kayit-baslik{
  padding:14px 16px;border-bottom:1px solid var(--cizgi);
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:800;letter-spacing:.5px;
}
#kayit-liste{flex:1;overflow-y:auto;padding:10px 16px;-webkit-overflow-scrolling:touch}
.kayit{padding:9px 0;border-bottom:1px solid var(--cizgi);font-size:12.5px;line-height:1.5}
.kayit:last-child{border-bottom:none}
.kayit b{display:block;font-family:var(--mono);font-size:10px;color:var(--soluk);margin-bottom:3px;letter-spacing:.5px}
.kayit .dnk{font-family:var(--mono);color:var(--camgobegi);font-size:12px}
#kayit-alt{padding:12px 16px;border-top:1px solid var(--cizgi);display:flex;gap:8px}

/* ---------- yazdırma ---------- */
@media print{
  body>*:not(#kayit-katman){display:none!important}
  #kayit-katman{position:static;display:block!important;background:#fff;padding:0}
  #kayit-kutu{border:none;background:#fff;color:#000}
  #kayit-baslik,#kayit-alt{display:none}
  .kayit{border-color:#ddd;color:#000}
  .kayit .dnk{color:#000}
  .kayit b{color:#555}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";

/* =======================================================================
   1) MADDE VERİLERİ
   ======================================================================= */
const AG = (s)=>s.replace(/(\d+)/g,(m)=>m.split("").map(d=>"₀₁₂₃₄₅₆₇₈₉"[+d]).join(""));

const MADDE = {
  H2O:{ad:"Saf su",f:"H₂O",tur:"su"},

  HCl:{ad:"Hidroklorik asit",f:"HCl",tur:"asit",H:1,anyon:"Cl",anyonYuk:1,derisim:1},
  HNO3:{ad:"Nitrik asit",f:"HNO₃",tur:"asit",H:1,anyon:"NO3",anyonYuk:1,derisim:1,yukseltgen:true},
  H2SO4:{ad:"Sülfürik asit",f:"H₂SO₄",tur:"asit",H:2,anyon:"SO4",anyonYuk:2,derisim:1},

  NaOH:{ad:"Sodyum hidroksit",f:"NaOH",tur:"baz",OH:1,derisim:1,kuvvetli:true},
  KOH:{ad:"Potasyum hidroksit",f:"KOH",tur:"baz",OH:1,derisim:1,kuvvetli:true},
  LiOH:{ad:"Lityum hidroksit",f:"LiOH",tur:"baz",OH:1,derisim:1,kuvvetli:true},
  Ca_OH_2:{ad:"Kalsiyum hidroksit",f:"Ca(OH)₂",tur:"kati-baz",OH:2,MA:74.09,cozunurluk:0.022},
  Mg_OH_2:{ad:"Magnezyum hidroksit",f:"Mg(OH)₂",tur:"kati-baz",OH:2,MA:58.32,cozunurluk:0.0002},

  Li:{ad:"Lityum",f:"Li",tur:"metal",MA:6.94,deger:1,grup:"1A"},
  Na:{ad:"Sodyum",f:"Na",tur:"metal",MA:22.99,deger:1,grup:"1A"},
  K:{ad:"Potasyum",f:"K",tur:"metal",MA:39.10,deger:1,grup:"1A"},
  Rb:{ad:"Rubidyum",f:"Rb",tur:"metal",MA:85.47,deger:1,grup:"1A"},
  Cs:{ad:"Sezyum",f:"Cs",tur:"metal",MA:132.91,deger:1,grup:"1A"},

  Be:{ad:"Berilyum",f:"Be",tur:"metal",MA:9.01,deger:2,grup:"2A"},
  Mg:{ad:"Magnezyum",f:"Mg",tur:"metal",MA:24.31,deger:2,grup:"2A"},
  Ca:{ad:"Kalsiyum",f:"Ca",tur:"metal",MA:40.08,deger:2,grup:"2A"},
  Ba:{ad:"Baryum",f:"Ba",tur:"metal",MA:137.33,deger:2,grup:"2A"},

  Al:{ad:"Alüminyum",f:"Al",tur:"metal",MA:26.98,deger:3,amfoter:true},
  Zn:{ad:"Çinko",f:"Zn",tur:"metal",MA:65.38,deger:2},
  Fe:{ad:"Demir",f:"Fe",tur:"metal",MA:55.85,deger:2,renk:"fe"},
  Pb:{ad:"Kurşun",f:"Pb",tur:"metal",MA:207.2,deger:2},
  Cu:{ad:"Bakır",f:"Cu",tur:"metal",MA:63.55,deger:2,renk:"cu"},
  Ag:{ad:"Gümüş",f:"Ag",tur:"metal",MA:107.87,deger:1},
  Au:{ad:"Altın",f:"Au",tur:"metal",MA:196.97,deger:3},

  NaCl:{ad:"Sodyum klorür",f:"NaCl",tur:"tuz",MA:58.44,iyon:{Cl:1}},
  AgNO3:{ad:"Gümüş nitrat",f:"AgNO₃",tur:"tuz",MA:169.87,iyon:{Ag:1}}
};

/* etkinlik sırası — hidrojenin solundakiler asitten H₂ açığa çıkarır */
const ETKINLIK = ["Cs","Rb","K","Ba","Ca","Na","Li","Mg","Al","Zn","Fe","Pb","H","Cu","Ag","Au"];
const hIndeks = ETKINLIK.indexOf("H");
const asittenH2 = (m)=>ETKINLIK.indexOf(m) > -1 && ETKINLIK.indexOf(m) < hIndeks;

const MIKTAR_SIVI = [10,25,50,100];
const MIKTAR_KATI = [0.5,1,2,5];

/* =======================================================================
   2) BEHER DURUMU
   ======================================================================= */
let hazne, kapakKapali, bekAcik, belirtec, kayitlar;

function sifirla(){
  hazne = {
    hacim:0,            // mL
    nH:0, nOH:0,        // mol
    sicaklik:298.15,    // K
    cokelek:0,          // 0-1 görsel yoğunluk
    cokelekAd:"",
    iyon:{Ag:0, Cl:0},
    metaller:{},        // çözünmemiş metal mol
    katilar:[],         // beherdeki katı parçalar
    gaz:null,           // "H2" | "NO2" | "buhar"
    basinc:1.0,
    kaynama:false
  };
  kapakKapali = false;
  bekAcik = false;
  kayitlar = [];
  kabarciklar.length = 0; kivilcimlar.length = 0; damlalar.length = 0;
  sivi = 0; hedefSivi = 0;
}

/* ---- pH hesabı: net mol / hacim ---- */
function pHHesapla(){
  if(hazne.hacim <= 0) return null;
  const V = hazne.hacim/1000;
  const net = hazne.nH - hazne.nOH;
  if(Math.abs(net) < 1e-9) return 7;
  if(net > 0){
    const d = net/V;
    return Math.max(0, Math.min(14, -Math.log10(d)));
  }
  const d = (-net)/V;
  return Math.max(0, Math.min(14, 14 + Math.log10(d)));
}

/* =======================================================================
   3) TEPKİME MOTORU
   ======================================================================= */
function denklemMetalAsit(m, asitKod){
  const md = MADDE[m], as = MADDE[asitKod];
  const n = md.deger;
  if(asitKod === "H2SO4"){
    // 2M + n H₂SO₄ → M₂(SO₄)ₙ + n H₂   (n çift ise 2'ye böl)
    if(n % 2 === 0){
      const k = n/2;
      return `${md.f}(k) + ${k>1?k:""}H₂SO₄(suda) → ${md.f}${k>1?"("+"SO₄"+")"+AG(String(k)):"SO₄"}(suda) + ${k>1?k:""}H₂(g)`;
    }
    return `2${md.f}(k) + ${n>1?n:""}H₂SO₄(suda) → ${md.f}₂${n>1?"(SO₄)"+AG(String(n)):"SO₄"}(suda) + ${n>1?n:""}H₂(g)`;
  }
  const asF = as.f, anF = as.anyon === "NO3" ? "NO₃" : "Cl";
  if(n === 1) return `2${md.f}(k) + 2${asF}(suda) → 2${md.f}${anF}(suda) + H₂(g)`;
  if(n === 2) return `${md.f}(k) + 2${asF}(suda) → ${md.f}${anF}${anF==="Cl"?"₂":"₂"}(suda) + H₂(g)`;
  return `2${md.f}(k) + 6${asF}(suda) → 2${md.f}${anF}₃(suda) + 3H₂(g)`;
}

function mevcutAsit(){
  return ["HCl","HNO3","H2SO4"].find(a => (hazne.asitler && hazne.asitler[a] > 0));
}

function ekle(kod, miktar){
  const m = MADDE[kod];
  if(!m) return;
  hazne.asitler = hazne.asitler || {HCl:0,HNO3:0,H2SO4:0};
  let denklem = "", aciklama = "", uyari = false;

  /* ---------- SU ---------- */
  if(m.tur === "su"){
    hazne.hacim += miktar;
    damlaAt("rgba(0,180,216,.85)");
    denklem = "H₂O(s)";
    aciklama = `Behere ${miktar} mL saf su eklendi.`;
    const s = bekleyenleriIsle();
    if(s){ denklem = s.denklem || denklem; aciklama = s.aciklama || aciklama; uyari = !!s.uyari; }
  }

  /* ---------- ASİT ---------- */
  else if(m.tur === "asit"){
    if(hazne.hacim === 0 && miktar > 0){ /* asidin kendisi çözelti, hacme katılır */ }
    const mol = m.derisim * (miktar/1000) * m.H;
    hazne.hacim += miktar;
    hazne.nH += mol;
    hazne.asitler[kod] += m.derisim * (miktar/1000);
    damlaAt("rgba(255,220,220,.85)");
    denklem = `${m.f}(suda) → ${m.H>1?"2":""}H⁺(suda) + ${m.anyon==="SO4"?"SO₄²⁻":m.anyon==="NO3"?"NO₃⁻":"Cl⁻"}(suda)`;
    aciklama = `${miktar} mL 1 M ${m.ad} eklendi (${mol.toFixed(3)} mol H⁺).`;

    if(hazne.nOH > 0){
      const s = notrlesme();
      denklem = s.denklem; aciklama += " " + s.aciklama;
    }
    // asit + bekleyen metal
    const bekleyenM = Object.keys(hazne.metaller).find(k => hazne.metaller[k] > 0);
    if(bekleyenM){
      const s = metalAsitTepkimesi(bekleyenM, hazne.metaller[bekleyenM], kod);
      if(s){ hazne.metaller[bekleyenM] = 0; katiSil(bekleyenM); denklem = s.denklem; aciklama = s.aciklama; uyari = s.uyari; }
    }
  }

  /* ---------- SIVI BAZ ---------- */
  else if(m.tur === "baz"){
    const mol = m.derisim * (miktar/1000) * m.OH;
    hazne.hacim += miktar;
    hazne.nOH += mol;
    damlaAt("rgba(220,235,255,.85)");
    denklem = `${m.f}(suda) → ${m.f.replace("OH","")}⁺(suda) + OH⁻(suda)`;
    aciklama = `${miktar} mL 1 M ${m.ad} eklendi (${mol.toFixed(3)} mol OH⁻).`;
    if(hazne.nH > 0){
      const s = notrlesme();
      denklem = s.denklem; aciklama += " " + s.aciklama;
    }
  }

  /* ---------- KATI BAZ (az çözünen) ---------- */
  else if(m.tur === "kati-baz"){
    const mol = miktar / m.MA;
    if(hazne.hacim === 0){
      hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
      katiEkle(kod, Math.max(1, Math.min(6, Math.round(miktar*1.5))));
      denklem = `${m.f}(k)`;
      aciklama = `${miktar} g ${m.ad} behere kondu. Çözünmesi için su gerekiyor.`;
    } else {
      const V = hazne.hacim/1000;
      const cozunen = Math.min(mol, m.cozunurluk * V);
      hazne.nOH += cozunen * m.OH;
      if(mol - cozunen > 0.0005){
        hazne.cokelek = Math.min(1, hazne.cokelek + 0.5);
        hazne.cokelekAd = m.f;
      }
      denklem = `${m.f}(k) ⇌ ${m.f.replace(/\(OH\)₂/,"")}²⁺(suda) + 2OH⁻(suda)`;
      aciklama = `${m.ad} suda az çözünür. ${cozunen.toFixed(4)} mol çözündü, kalanı dipte çökelek olarak durdu.`;
      if(hazne.nH > 0){ const s = notrlesme(); aciklama += " " + s.aciklama; }
    }
  }

  /* ---------- TUZLAR ---------- */
  else if(m.tur === "tuz"){
    const mol = miktar / m.MA;
    if(hazne.hacim === 0){
      hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
      katiEkle(kod, Math.max(1, Math.min(6, Math.round(miktar*1.5))));
      denklem = `${m.f}(k)`;
      aciklama = `${miktar} g ${m.ad} behere kondu. Çözünmesi için su gerekiyor.`;
    } else {
      Object.keys(m.iyon).forEach(i => hazne.iyon[i] += mol * m.iyon[i]);
      denklem = `${m.f}(k) → ${kod==="NaCl"?"Na⁺(suda) + Cl⁻(suda)":"Ag⁺(suda) + NO₃⁻(suda)"}`;
      aciklama = `${miktar} g ${m.ad} suda çözündü.`;
      // çökelme
      const ort = Math.min(hazne.iyon.Ag, hazne.iyon.Cl);
      if(ort > 0){
        hazne.iyon.Ag -= ort; hazne.iyon.Cl -= ort;
        hazne.cokelek = Math.min(1, hazne.cokelek + 0.6);
        hazne.cokelekAd = "AgCl";
        denklem = "Ag⁺(suda) + Cl⁻(suda) → AgCl(k)↓";
        aciklama = `Beyaz AgCl çökeleği oluştu (${ort.toFixed(4)} mol). Gümüş klorür suda çözünmez.`;
      }
    }
  }

  /* ---------- METALLER ---------- */
  else if(m.tur === "metal"){
    const mol = miktar / m.MA;
    const asit = mevcutAsit();
    let s = null;

    if(asit){
      s = metalAsitTepkimesi(kod, mol, asit);
    } else if(hazne.hacim > 0 && hazne.nOH > 0 && m.amfoter){
      s = amfoterTepkime(kod, mol);
    } else if(hazne.hacim > 0){
      s = metalSuTepkimesi(kod, mol);
    }

    if(s){ denklem = s.denklem; aciklama = s.aciklama; uyari = s.uyari; }
    else {
      hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
      katiEkle(kod, Math.max(1, Math.min(6, Math.round(miktar*1.5))));
      denklem = `${m.f}(k)`;
      aciklama = hazne.hacim === 0
        ? `${miktar} g ${m.ad} boş behere kondu. Tepkime için su veya asit gerekiyor.`
        : `${miktar} g ${m.ad} eklendi ama bu ortamda tepkime vermedi.`;
    }
  }

  hazne.sicaklik = Math.min(hazne.sicaklik, 1200);
  ekraniYaz(denklem, aciklama, uyari);
  kayitEkle(denklem, aciklama);
  gostergeleriYaz();
}


/* tepkimeye giren katının parçalarını beherden kaldır */
function katiSil(kod){
  for(let i=hazne.katilar.length-1;i>=0;i--)
    if(hazne.katilar[i].kod === kod) hazne.katilar.splice(i,1);
}

/* su eklenince beherde bekleyen katıları işle */
function bekleyenleriIsle(){
  let son = null;
  for(const kod of Object.keys(hazne.metaller)){
    const mol = hazne.metaller[kod];
    if(!mol || mol <= 0) continue;
    const m = MADDE[kod];
    if(!m) continue;

    if(m.tur === "tuz"){
      Object.keys(m.iyon).forEach(i => hazne.iyon[i] += mol * m.iyon[i]);
      hazne.metaller[kod] = 0; katiSil(kod);
      son = {denklem:`${m.f}(k) → ${kod==="NaCl"?"Na⁺(suda) + Cl⁻(suda)":"Ag⁺(suda) + NO₃⁻(suda)"}`,
             aciklama:`Beherde bekleyen ${m.ad} suda çözündü.`, uyari:false};
      const ort = Math.min(hazne.iyon.Ag, hazne.iyon.Cl);
      if(ort > 0){
        hazne.iyon.Ag -= ort; hazne.iyon.Cl -= ort;
        hazne.cokelek = Math.min(1, hazne.cokelek + .6); hazne.cokelekAd = "AgCl";
        son = {denklem:"Ag⁺(suda) + Cl⁻(suda) → AgCl(k)↓",
               aciklama:`Beyaz AgCl çökeleği oluştu (${ort.toFixed(4)} mol).`, uyari:false};
      }
    }
    else if(m.tur === "kati-baz"){
      const V = hazne.hacim/1000;
      const coz = Math.min(mol, m.cozunurluk * V);
      hazne.nOH += coz * m.OH;
      hazne.metaller[kod] = mol - coz;
      if(mol - coz > 0.0005){ hazne.cokelek = Math.min(1, hazne.cokelek + .4); hazne.cokelekAd = m.f; }
      else katiSil(kod);
      son = {denklem:`${m.f}(k) ⇌ ${m.f.replace(/\(OH\)₂/,"")}²⁺(suda) + 2OH⁻(suda)`,
             aciklama:`${m.ad} suda az çözünür; ${coz.toFixed(4)} mol çözündü.`, uyari:false};
    }
    else if(m.tur === "metal" && (m.grup === "1A" || ["Ca","Ba"].includes(kod) ||
             (kod === "Mg" && hazne.sicaklik > 350))){
      const s = metalSuTepkimesi(kod, mol);
      hazne.metaller[kod] = 0; katiSil(kod);
      son = s;
    }
  }
  if(hazne.nH > 0 && hazne.nOH > 0){ const n = notrlesme(); son = son || {uyari:false}; son.denklem = n.denklem; son.aciklama = (son.aciklama||"") + " " + n.aciklama; }
  return son;
}

/* ---- metal + su ---- */
function metalSuTepkimesi(kod, mol){
  const m = MADDE[kod];
  if(m.grup === "1A"){
    hazne.nOH += mol;
    const siddetli = ["K","Rb","Cs"].includes(kod);
    hazne.sicaklik += siddetli ? 90*mol*10 : 45*mol*10;
    hazne.gaz = "H2";
    patlat(siddetli ? "#cc44ff" : "#ff7733", siddetli ? 90 : 45);
    ses(140, .45, "sawtooth");
    return {
      denklem:`2${m.f}(k) + 2H₂O(s) → 2${m.f}OH(suda) + H₂(g)`,
      aciklama:`${m.ad} suyla ${siddetli?"çok şiddetli":"hızlı"} tepkime verdi. Hidrojen gazı çıktı, çözelti bazikleşti, ortam ısındı.${siddetli?" Gerçek laboratuvarda bu tepkime patlayıcıdır.":""}`,
      uyari:siddetli
    };
  }
  if(kod === "Ca" || kod === "Ba"){
    hazne.nOH += mol*2;
    hazne.sicaklik += 25*mol*10;
    hazne.gaz = "H2";
    kabarcikPatlamasi(25);
    return {
      denklem:`${m.f}(k) + 2H₂O(s) → ${m.f}(OH)₂(suda) + H₂(g)`,
      aciklama:`${m.ad} soğuk suyla yavaşça tepkime verdi. Kabarcıklar hidrojen gazıdır.`,
      uyari:false
    };
  }
  if(kod === "Mg"){
    if(hazne.sicaklik > 350){
      hazne.nOH += mol*2; hazne.gaz = "H2"; kabarcikPatlamasi(15);
      return {denklem:`Mg(k) + 2H₂O(g) → Mg(OH)₂(k) + H₂(g)`,
        aciklama:"Magnezyum ancak sıcak su veya su buharıyla tepkime verir. Bek açık olduğu için tepkime başladı.",uyari:false};
    }
    hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
    katiEkle(kod, 3);
    return {denklem:"Mg(k) + H₂O(s) → tepkime yok",
      aciklama:"Magnezyum soğuk suyla pratikte tepkime vermez. Beki açıp suyu ısıtmayı dene.",uyari:false};
  }
  if(kod === "Be"){
    hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
    katiEkle(kod, 3);
    return {denklem:"Be(k) + H₂O(s) → tepkime yok",
      aciklama:"Berilyum yüzeyindeki oksit tabakası nedeniyle suyla tepkime vermez.",uyari:false};
  }
  hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
  katiEkle(kod, 3);
  return {denklem:`${m.f}(k) + H₂O(s) → tepkime yok`,
    aciklama:`${m.ad} suyla tepkime vermez. Asit eklemeyi dene.`,uyari:false};
}

/* ---- metal + asit ---- */
function metalAsitTepkimesi(kod, mol, asitKod){
  const m = MADDE[kod];
  if(m.tur !== "metal") return null;

  // soy metaller + nitrik asit (yükseltgen asit)
  if(!asittenH2(kod)){
    if(asitKod === "HNO3" && (kod === "Cu" || kod === "Ag")){
      hazne.nH = Math.max(0, hazne.nH - mol*2);
      hazne.gaz = "NO2";
      hazne.sicaklik += 12*mol*10;
      kabarcikPatlamasi(40);
      const d = kod === "Cu"
        ? "Cu(k) + 4HNO₃(der) → Cu(NO₃)₂(suda) + 2NO₂(g) + 2H₂O(s)"
        : "Ag(k) + 2HNO₃(der) → AgNO₃(suda) + NO₂(g) + H₂O(s)";
      return {denklem:d,
        aciklama:`${m.ad} hidrojenin altında olduğu için normal asitlerle tepkime vermez. Ama nitrik asit yükseltgen bir asittir: H₂ değil, kahverengi NO₂ gazı açığa çıkar.`,
        uyari:true};
    }
    if(kod === "Au"){
      hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
      katiEkle(kod, 2);
      return {denklem:"Au(k) + asit → tepkime yok",
        aciklama:"Altın tek başına hiçbir asitle tepkime vermez. Yalnızca kral suyu (3 HCl : 1 HNO₃) altını çözer.",uyari:false};
    }
    hazne.metaller[kod] = (hazne.metaller[kod]||0) + mol;
    katiEkle(kod, 3);
    return {denklem:`${m.f}(k) + ${MADDE[asitKod].f}(suda) → tepkime yok`,
      aciklama:`${m.ad} etkinlik sırasında hidrojenin altındadır; asitten hidrojen gazı açığa çıkaramaz.`,uyari:false};
  }

  // etkin metal + asit → tuz + H₂
  const tuketilenH = Math.min(hazne.nH, mol * m.deger);
  hazne.nH -= tuketilenH;
  hazne.gaz = "H2";
  hazne.sicaklik += 18*mol*10;
  kabarcikPatlamasi(kod === "Zn" || kod === "Fe" ? 30 : 55);
  ses(200,.25,"square");
  return {
    denklem:denklemMetalAsit(kod, asitKod),
    aciklama:`${m.ad} asitle tepkime verdi ve hidrojen gazı açığa çıktı. Kabarcıklar H₂'dir. ${tuketilenH.toFixed(3)} mol H⁺ harcandı.`,
    uyari:false
  };
}

/* ---- amfoter metal + kuvvetli baz ---- */
function amfoterTepkime(kod, mol){
  hazne.gaz = "H2";
  hazne.nOH = Math.max(0, hazne.nOH - mol);
  hazne.sicaklik += 15*mol*10;
  kabarcikPatlamasi(45);
  return {
    denklem:"2Al(k) + 2NaOH(suda) + 6H₂O(s) → 2Na[Al(OH)₄](suda) + 3H₂(g)",
    aciklama:"Alüminyum amfoterdir: hem asitle hem kuvvetli bazla tepkime verir. Burada bazla tepkimeye girip hidrojen gazı açığa çıkardı.",
    uyari:false
  };
}

/* ---- nötrleşme ---- */
function notrlesme(){
  const ort = Math.min(hazne.nH, hazne.nOH);
  hazne.nH -= ort; hazne.nOH -= ort;
  hazne.sicaklik += 57.3 * ort * 2;   // nötrleşme ısısı ~57 kJ/mol
  return {
    denklem:"H⁺(suda) + OH⁻(suda) → H₂O(s)",
    aciklama:`Nötrleşme oldu: ${ort.toFixed(3)} mol H⁺ ile OH⁻ birleşti, ortam ısındı.`
  };
}

function belirtecRengi(pH){
  if(pH === null || belirtec === "yok") return null;
  if(belirtec === "turnusol")
    return pH < 5.5 ? {t:"rgba(232,60,60,.62)",b:"rgba(130,12,12,.78)",ad:"kırmızı"}
         : pH > 8.5 ? {t:"rgba(46,80,232,.62)",b:"rgba(14,25,133,.78)",ad:"mavi"}
                    : {t:"rgba(150,120,180,.5)",b:"rgba(70,50,110,.7)",ad:"mor"};
  if(belirtec === "fenolftalein")
    return pH < 8.2 ? {t:"rgba(225,232,240,.30)",b:"rgba(120,130,145,.55)",ad:"renksiz"}
                    : {t:"rgba(233,74,168,.62)",b:"rgba(120,20,80,.78)",ad:"pembe"};
  if(belirtec === "metiloranj")
    return pH < 3.1 ? {t:"rgba(226,60,40,.62)",b:"rgba(120,20,10,.78)",ad:"kırmızı"}
         : pH > 4.4 ? {t:"rgba(245,170,40,.62)",b:"rgba(150,90,10,.78)",ad:"sarı"}
                    : {t:"rgba(240,120,40,.62)",b:"rgba(140,60,10,.78)",ad:"turuncu"};
  return null;
}

  K :{a:"#d5d9df",k:"#8b9199",yuzer:true},  Rb:{a:"#d0d4da",k:"#868c94",yuzer:true},
  Cs:{a:"#e0d7bd",k:"#9b9184",yuzer:true},
  Be:{a:"#b9c0c7",k:"#787f87"}, Mg:{a:"#cfd5db",k:"#8b9199"},
  Ca:{a:"#d6dae0",k:"#8f959d"}, Ba:{a:"#c9ced5",k:"#828992"},
  Al:{a:"#d3d9e0",k:"#8d949c"}, Zn:{a:"#c2cad3",k:"#7c848d"},
  Fe:{a:"#8b959f",k:"#4c545c"}, Pb:{a:"#7e858f",k:"#464c54"},
  Cu:{a:"#c9784a",k:"#7d3f1e"}, Ag:{a:"#e2e6ea",k:"#9aa0a7"},
  Au:{a:"#e6bb45",k:"#9c7513"},
  NaCl:{a:"#f2f4f7",k:"#c3c8cf"}, AgNO3:{a:"#eef1f5",k:"#bcc2c9"},
  Ca_OH_2:{a:"#f4f6f8",k:"#c9ced4"}, Mg_OH_2:{a:"#f4f6f8",k:"#c9ced4"}
};

/* katı parçaları: sabit görünmeleri için tohum saklanır */
function katiEkle(kod, adet){
  const g = KATI_GORUNUM[kod] || {a:"#cfd5db",k:"#8b9199"};
  for(let i=0;i<adet;i++){
    const kose = 6 + Math.floor(Math.random()*3);
    const yaricap = [];
    for(let j=0;j<kose;j++) yaricap.push(.62 + Math.random()*.42);
    hazne.katilar.push({
      kod, kose, yaricap,
      y: B.tepe - 30 - Math.random()*50,   // yukarıdan düşer
      vy: 0, yerlesti:false,
      boy: 16 + Math.random()*10,
      ofs: (Math.random()-.5) * (B.ic*1.35),   // yatay konum
      derinlik: Math.random(),                  // 0 arka – 1 ön
      aci: Math.random()*Math.PI,
      yuzer: !!g.yuzer,
      sallan: Math.random()*100
    });
  }
}

function damlaAt(renk){ damlalar.push({x:B.cx+(Math.random()*18-9), y:18, r:renk}); }
function kabarcikPatlamasi(n){ for(let i=0;i<n;i++) kabarciklar.push(yeniKabarcik()); }
function yeniKabarcik(){
  return {x:B.cx + (Math.random()-.5)*B.ic*1.6, y:B.taban-8,
          r:Math.random()*2.4+.8, vy:-(Math.random()*1.4+.5), s:Math.random()*100};
}
function yuzeyY(){ return B.taban - B.yuk*sivi; }
function patlat(renk, n){
  const y = yuzeyY();
  for(let i=0;i<n;i++)
    kivilcimlar.push({x:B.cx,y,vx:(Math.random()-.5)*14,vy:(Math.random()-.9)*15,
                      r:Math.random()*3.4+1.2,om:1,az:Math.random()*.025+.018,renk});
}

let sesCtx = null;
function ses(frk, sure, tip="sine"){
  if(!sesCtx) return;
  try{
    const o = sesCtx.createOscillator(), g = sesCtx.createGain();
    o.type = tip; o.frequency.setValueAtTime(frk, sesCtx.currentTime);
    g.gain.setValueAtTime(.12, sesCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, sesCtx.currentTime + sure);
    o.connect(g); g.connect(sesCtx.destination);
    o.start(); o.stop(sesCtx.currentTime + sure);
  }catch(e){}
}

/* ---------- yardımcı çizimler ---------- */
function elips(x,y,rx,ry,bas,son,ters){
  ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,bas,son,ters);
}

/* cam gövdenin arkası: arka duvar + taban elipsinin arka yayı */
function beherArka(){
  ctx.save();
  // iç boşluğun arka duvarı (hafif koyu, derinlik hissi)
  const g = ctx.createLinearGradient(B.cx-B.rx,0,B.cx+B.rx,0);
  g.addColorStop(0,   T.arkaKenar);
  g.addColorStop(.5,  T.arkaOrta);
  g.addColorStop(1,   T.arkaKenar);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(B.cx-B.ic, B.tepe);
  ctx.lineTo(B.cx-B.ic, B.taban);
  elips(B.cx,B.taban,B.ic,B.ry-2,Math.PI,0,true);
  ctx.lineTo(B.cx+B.ic, B.tepe);
  elips(B.cx,B.tepe,B.ic,B.ry-2,0,Math.PI,true);
  ctx.closePath(); ctx.fill();

  // taban elipsinin arka yayı
  ctx.strokeStyle=T.arkaYay; ctx.lineWidth=2;
  ctx.beginPath(); elips(B.cx,B.taban,B.ic,B.ry-2,Math.PI,0,true); ctx.stroke();
  ctx.restore();
}

/* cam gövdenin önü: duvarlar, taban, ağız halkası, parlamalar */
function beherOn(){
  ctx.save();

  /* --- cam gövde dolgusu (çok hafif) --- */
  const cam = ctx.createLinearGradient(B.cx-B.rx,0,B.cx+B.rx,0);
  cam.addColorStop(0,    T.camKenar);
  cam.addColorStop(.14,  T.camIc);
  cam.addColorStop(.5,   T.camOrta);
  cam.addColorStop(.86,  T.camIc);
  cam.addColorStop(1,    T.camKenar);
  ctx.fillStyle = cam;
  ctx.beginPath();
  ctx.moveTo(B.cx-B.rx, B.tepe);
  ctx.lineTo(B.cx-B.rx, B.taban);
  elips(B.cx,B.taban,B.rx,B.ry,Math.PI,0,true);
  ctx.lineTo(B.cx+B.rx, B.tepe);
  elips(B.cx,B.tepe,B.rx,B.ry,0,Math.PI,true);
  ctx.closePath(); ctx.fill();

  /* --- yan duvarlar --- */
  ctx.strokeStyle=T.duvar; ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(B.cx-B.rx,B.tepe); ctx.lineTo(B.cx-B.rx,B.taban-B.ry*.55);
  ctx.moveTo(B.cx+B.rx,B.tepe); ctx.lineTo(B.cx+B.rx,B.taban-B.ry*.55);
  ctx.stroke();

  /* --- taban ön yayı (kalın cam) --- */
  ctx.strokeStyle=T.tabanYay; ctx.lineWidth=3.2;
  ctx.beginPath(); elips(B.cx,B.taban,B.rx,B.ry,0,Math.PI,false); ctx.stroke();
  ctx.strokeStyle=T.tabanIc; ctx.lineWidth=2;
  ctx.beginPath(); elips(B.cx,B.taban,B.ic,B.ry-2,0,Math.PI,false); ctx.stroke();

  /* --- ölçek çizgileri ve mL yazıları --- */
  ctx.lineWidth=1.6; ctx.font="600 11px ui-monospace,monospace"; ctx.textAlign="left";
  for(let v=50; v<=B.kapasite; v+=50){
    const y = B.taban - B.yuk*(v/B.kapasite);
    const uzun = (v % 100 === 0);
    ctx.strokeStyle = uzun ? T.olcekUzun : T.olcekKisa;
    ctx.beginPath();
    ctx.moveTo(B.cx+B.rx-(uzun?30:18), y);
    ctx.lineTo(B.cx+B.rx-4, y);
    ctx.stroke();
    if(uzun){
      ctx.fillStyle=T.olcekYazi;
      ctx.fillText(v, B.cx+B.rx+8, y+4);
    }
  }

  /* --- ağız halkası (cam kalınlığı) --- */
  ctx.strokeStyle=T.agiz; ctx.lineWidth=2.6;
  ctx.beginPath(); elips(B.cx,B.tepe,B.rx,B.ry,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=T.agizIc; ctx.lineWidth=1.8;
  ctx.beginPath(); elips(B.cx,B.tepe+3,B.ic,B.ry-3,0,0,Math.PI*2); ctx.stroke();

  /* --- döküm ağzı (beher burnu) --- */
  ctx.strokeStyle=T.agiz; ctx.lineWidth=2.6;
  ctx.beginPath();
  ctx.moveTo(B.cx-B.rx+4, B.tepe-3);
  ctx.quadraticCurveTo(B.cx-B.rx-16, B.tepe-9, B.cx-B.rx-19, B.tepe+5);
  ctx.stroke();

  /* --- parlamalar --- */
  const p1 = ctx.createLinearGradient(0,B.tepe,0,B.taban);
  p1.addColorStop(0,T.parlaUst);
  p1.addColorStop(.45,T.parlaOrta);
  p1.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=p1;
  ctx.fillRect(B.cx-B.rx*.72, B.tepe+B.ry*.7, 11, B.yuk-B.ry);
  ctx.fillStyle=T.parlaYan;
  ctx.fillRect(B.cx+B.rx*.60, B.tepe+B.ry, 5, B.yuk-B.ry*1.6);

  ctx.restore();
}

/* katı parçaları çiz */
function katilariCiz(surface, sividaMi){
  if(!hazne.katilar.length) return;
  const liste = hazne.katilar.slice().sort((a,b)=>a.derinlik-b.derinlik);
  for(const k of liste){
    const g = KATI_GORUNUM[k.kod] || {a:"#cfd5db",k:"#8b9199"};
    const yuzuyor = k.yuzer && sividaMi;
    const tabanY = B.taban - 8 - k.derinlik*10;
    const hedefY = yuzuyor ? surface - 2 : tabanY;

    // düşme: yerçekimi + hafif sekme
    if(!k.yerlesti){
      k.vy += 0.85;
      k.y += k.vy;
      if(k.y >= hedefY){
        k.y = hedefY; k.vy *= -0.32;
        if(Math.abs(k.vy) < 1.4){ k.yerlesti = true; k.vy = 0; ses(yuzuyor?520:240,.09,"triangle"); }
      }
    } else {
      k.y = hedefY + (yuzuyor ? Math.sin((dalga*2)+k.sallan)*2 : 0);
    }
    const y = k.y;
    const ol = .82 + k.derinlik*.36;
    const x = B.cx + k.ofs * (0.55 + k.derinlik*0.45) * 0.62;

    // parçanın altına gölge (tabana oturduğu belli olsun)
    if(!yuzuyor){
      const uz = Math.max(0, 1 - Math.abs(hedefY - y)/70);
      ctx.save(); ctx.globalAlpha = .55*uz; ctx.fillStyle = T.katiGolge;
      ctx.beginPath();
      ctx.ellipse(x, tabanY + k.boy*ol*.55, k.boy*ol*.85, k.boy*ol*.26, 0, 0, Math.PI*2);
      ctx.fill(); ctx.restore();
    }

    ctx.save();
    ctx.translate(x,y); ctx.rotate(k.aci + (yuzuyor?Math.sin(dalga+k.sallan)*.08:0));
    ctx.beginPath();
    for(let i=0;i<k.kose;i++){
      const a = (Math.PI*2*i)/k.kose;
      const r = k.boy*ol*k.yaricap[i];
      const px = Math.cos(a)*r, py = Math.sin(a)*r*.72;
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();
    const gr = ctx.createLinearGradient(-k.boy,-k.boy,k.boy,k.boy);
    gr.addColorStop(0, g.a); gr.addColorStop(.55, g.k); gr.addColorStop(1, g.a);
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = T.katiCiz; ctx.lineWidth = 1.2; ctx.stroke();
    // metalik parlama
    ctx.beginPath();
    ctx.ellipse(-k.boy*.22, -k.boy*.24, k.boy*.3*ol, k.boy*.15*ol, -.5, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.42)"; ctx.fill();
    ctx.restore();
  }
}

function ciz(){
  ctx.clearRect(0,0,tuval.width,tuval.height);
  dalga += .07;

  /* ---------- ısı ---------- */
  if(bekAcik){
    hazne.sicaklik = Math.min(hazne.sicaklik + .55, 1200);
  } else if(hazne.sicaklik > 298.15){
    hazne.sicaklik = Math.max(hazne.sicaklik - .16, 298.15);
  }

  hazne.kaynama = hazne.hacim > 0 && hazne.sicaklik >= 373.15;
  if(hazne.kaynama && bekAcik){
    if(!kapakKapali){
      hazne.hacim = Math.max(0, hazne.hacim - .05);
      hazne.sicaklik = Math.min(hazne.sicaklik, 375);
      if(Math.random() < .5) kabarciklar.push(yeniKabarcik());
      if(hazne.hacim === 0){
        bekAcik = false; dugmeleriYaz();
        ekraniYaz("Çözelti tamamen buharlaştı","Suyun tamamı buharlaştı, beherde yalnızca katı kalıntı kaldı.",true);
      }
    } else {
      hazne.basinc = Math.min(hazne.basinc + .004, 4);
      if(hazne.basinc > 3.4){
        kapakKapali = false; hazne.basinc = 1; dugmeleriYaz();
        patlat("#ffdd55", 60); ses(90,.5,"sawtooth");
        ekraniYaz("⚠️ Kapak basınçla fırladı","Kapalı kapta kaynayan sıvının buharı basıncı artırdı. Gerçek laboratuvarda ısıtılan kap asla tam kapatılmaz.",true);
      }
    }
  } else if(hazne.basinc > 1){
    hazne.basinc = Math.max(1, hazne.basinc - .01);
  }

  /* ---------- sıvı seviyesi ---------- */
  hedefSivi = Math.min(.94, hazne.hacim / B.kapasite);
  if(sivi < hedefSivi) sivi = Math.min(hedefSivi, sivi + .012);
  if(sivi > hedefSivi) sivi = Math.max(hedefSivi, sivi - .012);
  const yuzey = yuzeyY();
  const sividaMi = sivi > .02;

  /* ---------- zemin gölgesi ---------- */
  ctx.save();
  const golge = ctx.createRadialGradient(B.cx,B.taban+22,4,B.cx,B.taban+22,B.rx*1.25);
  golge.addColorStop(0,T.golge); golge.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=golge;
  ctx.beginPath(); ctx.ellipse(B.cx,B.taban+22,B.rx*1.2,15,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* ---------- damlalar ---------- */
  for(let i=damlalar.length-1;i>=0;i--){
    const d = damlalar[i];
    d.y += 11;
    if(d.y >= (sividaMi ? yuzey : B.taban-4)){ damlalar.splice(i,1); ses(600,.07); continue; }
    ctx.save(); ctx.strokeStyle=d.r; ctx.lineWidth=3.5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x,d.y+14); ctx.stroke(); ctx.restore();
  }

  /* ---------- camın arkası ---------- */
  beherArka();

  /* ---------- sıvı ---------- */
  if(sividaMi){
    const pH = pHHesapla();
    const bel = belirtecRengi(pH);
    let p = PALET.varsayilan;
    if(bel) p = {t:bel.t, b:bel.b};
    else if(hazne.metaller.Cu > 0) p = PALET.cu;
    else if(hazne.metaller.Fe > 0) p = PALET.fe;
    else if(hazne.nH === 0 && hazne.nOH === 0) p = PALET.su;

    // gövde
    ctx.save();
    const g = ctx.createLinearGradient(0,yuzey,0,B.taban);
    g.addColorStop(0,p.t); g.addColorStop(1,p.b);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(B.cx-B.ic, yuzey);
    ctx.lineTo(B.cx-B.ic, B.taban);
    elips(B.cx,B.taban,B.ic,B.ry-2,Math.PI,0,true);
    ctx.lineTo(B.cx+B.ic, yuzey);
    elips(B.cx,yuzey,B.ic,B.ry-3,0,Math.PI,true);
    ctx.closePath(); ctx.fill();

    // kenar koyulaşması (silindir hissi)
    const kenar = ctx.createLinearGradient(B.cx-B.ic,0,B.cx+B.ic,0);
    kenar.addColorStop(0,T.kenarKoyu);
    kenar.addColorStop(.22,"rgba(0,10,30,0)");
    kenar.addColorStop(.78,"rgba(0,10,30,0)");
    kenar.addColorStop(1,T.kenarKoyu);
    ctx.fillStyle=kenar;
    ctx.beginPath();
    ctx.moveTo(B.cx-B.ic, yuzey);
    ctx.lineTo(B.cx-B.ic, B.taban);
    elips(B.cx,B.taban,B.ic,B.ry-2,Math.PI,0,true);
    ctx.lineTo(B.cx+B.ic, yuzey);
    elips(B.cx,yuzey,B.ic,B.ry-3,0,Math.PI,true);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // çökelek (tabanda elips yığın)
    if(hazne.cokelek > 0){
      ctx.save();
      ctx.fillStyle = T.cokelek;
      ctx.beginPath();
      ctx.ellipse(B.cx, B.taban-4, B.ic-8, (B.ry-6) + 7*hazne.cokelek, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle=T.cokelekAlt;
      ctx.beginPath();
      ctx.ellipse(B.cx, B.taban-4+3, B.ic-14, (B.ry-9)+5*hazne.cokelek, 0, 0, Math.PI);
      ctx.fill();
      ctx.restore();
    }

    // katılar sıvının içinde
    katilariCiz(yuzey, true);

    // yüzey elipsi (menisküs)
    ctx.save();
    const yg = ctx.createLinearGradient(0,yuzey-B.ry,0,yuzey+B.ry);
    yg.addColorStop(0,T.meniskusUst);
    yg.addColorStop(.5,p.t);
    yg.addColorStop(1,T.meniskusAlt);
    ctx.fillStyle=yg;
    ctx.beginPath(); elips(B.cx,yuzey,B.ic,B.ry-3,0,0,Math.PI*2); ctx.fill();
    // dalgalanan parlama
    ctx.strokeStyle=T.meniskusCiz; ctx.lineWidth=1.6;
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2;a+=.1){
      const rr = (B.ic-6) + Math.sin(a*3+dalga)*2.5;
      const px = B.cx + Math.cos(a)*rr, py = yuzey + Math.sin(a)*(B.ry-5);
      a ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();

    if(Math.random() < .05 + (hazne.sicaklik-298)*.0035) kabarciklar.push(yeniKabarcik());
  } else {
    // sıvı yoksa katılar doğrudan tabanda
    katilariCiz(B.taban, false);
  }

  /* ---------- kabarcıklar ---------- */
  for(let i=kabarciklar.length-1;i>=0;i--){
    const k = kabarciklar[i];
    k.y += k.vy; k.x += Math.sin(k.s/12)*.4; k.s++;
    if(k.y < yuzey+2 || !sividaMi){ kabarciklar.splice(i,1); continue; }
    ctx.save();
    ctx.beginPath(); ctx.arc(k.x,k.y,k.r,0,Math.PI*2);
    ctx.fillStyle = hazne.gaz === "NO2" ? "rgba(200,130,55,.45)" : T.kabarcik;
    ctx.fill();
    ctx.strokeStyle=T.kabarcikCiz; ctx.lineWidth=.7; ctx.stroke();
    ctx.restore();
  }

  /* ---------- camın önü ---------- */
  beherOn();

  /* ---------- bek alevi ---------- */
  if(bekAcik){
    ctx.save();
    ctx.shadowBlur=26; ctx.shadowColor="#ff5533";
    for(let i=0;i<9;i++){
      const fx = B.cx-B.rx+18 + i*(B.rx*2-36)/8;
      const h = 20 + Math.sin(dalga*3.4+i*1.3)*9;
      const alev = ctx.createLinearGradient(0,B.taban+B.ry+8,0,B.taban+B.ry+8-h);
      alev.addColorStop(0,"rgba(255,190,80,.75)");
      alev.addColorStop(.55,"rgba(255,110,40,.5)");
      alev.addColorStop(1,"rgba(255,60,20,0)");
      ctx.fillStyle=alev;
      ctx.beginPath();
      ctx.moveTo(fx-7,B.taban+B.ry+8);
      ctx.quadraticCurveTo(fx, B.taban+B.ry+8-h, fx+7, B.taban+B.ry+8);
      ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(120,130,142,.9)";
    ctx.fillRect(B.cx-70, B.taban+B.ry+8, 140, 7);
    ctx.restore();
  }

  /* ---------- kapak ---------- */
  if(kapakKapali){
    ctx.save();
    const kr = hazne.basinc > 2 ? "#ffcc33" : "#7fe8d4";
    ctx.fillStyle = "rgba(180,215,230,.22)";
    ctx.beginPath(); elips(B.cx,B.tepe-4,B.rx+3,B.ry+1,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = kr; ctx.lineWidth = 3;
    ctx.beginPath(); elips(B.cx,B.tepe-4,B.rx+3,B.ry+1,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = kr;
    ctx.beginPath(); ctx.ellipse(B.cx,B.tepe-11,13,6,0,0,Math.PI*2); ctx.fill();
    if(hazne.basinc > 1.4){
      ctx.font="bold 15px ui-monospace,monospace"; ctx.fillStyle="#ffcc33"; ctx.textAlign="center";
      ctx.fillText(hazne.basinc.toFixed(1)+" atm", B.cx, B.tepe-26);
    }
    ctx.restore();
  }

  /* ---------- kıvılcımlar ---------- */
  for(let i=kivilcimlar.length-1;i>=0;i--){
    const s = kivilcimlar[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=.3; s.om-=s.az;
    if(s.om<=0){ kivilcimlar.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,s.om);
    ctx.shadowBlur=12; ctx.shadowColor=s.renk;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=s.renk; ctx.fill(); ctx.restore();
  }

  gostergeleriYaz();
  requestAnimationFrame(ciz);
}

const $ = id => document.getElementById(id);

function gostergeleriYaz(){
  const pH = pHHesapla();
  $("ph-deger").textContent = pH === null ? "—" : pH.toFixed(2);
  $("sicaklik-deger").textContent = Math.round(hazne.sicaklik) + " K";
  $("hacim-deger").textContent = Math.round(hazne.hacim) + " mL";
}

function ekraniYaz(denklem, aciklama, uyari){
  const d = $("denklem");
  d.textContent = denklem;
  d.className = uyari ? "uyari" : "";
  $("aciklama").textContent = aciklama;
}

function kayitEkle(denklem, aciklama){
  const pH = pHHesapla();
  kayitlar.push({
    zaman:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),
    denklem, aciklama,
    pH: pH === null ? "—" : pH.toFixed(2),
    sicaklik: Math.round(hazne.sicaklik)
  });
}

function miktarSecenekleri(){
  const kod = $("madde").value;
  const t = MADDE[kod].tur;
  const sivi = (t === "su" || t === "asit" || t === "baz");
  const dizi = sivi ? MIKTAR_SIVI : MIKTAR_KATI;
  const birim = sivi ? "mL" : "g";
  $("miktar").innerHTML = dizi.map((v,i)=>
    `<option value="${v}"${i===1?" selected":""}>${v} ${birim}</option>`).join("");
}

function dugmeleriYaz(){
  const k = $("btn-kapak"), b = $("btn-bek");
  k.className = "btn-arac" + (kapakKapali ? " acik-kapak" : "");
  k.textContent = kapakKapali ? "🔒 Kapak kapalı" : "🔓 Kapak açık";
  b.className = "btn-arac" + (bekAcik ? " acik-bek" : "");
  b.textContent = bekAcik ? "🔥 Bek açık" : "🔥 Bek kapalı";
}

function kayitlariGoster(){
  const liste = $("kayit-liste");
  $("kayit-sayi").textContent = kayitlar.length + " kayıt";
  liste.innerHTML = kayitlar.length === 0
    ? '<div class="kayit">Henüz gözlem yok. Behere madde ekleyerek başla.</div>'
    : kayitlar.map(k =>
        `<div class="kayit"><b>${k.zaman} · pH ${k.pH} · ${k.sicaklik} K</b>
         <div class="dnk">${k.denklem}</div>${k.aciklama}</div>`).join("");
  $("kayit-katman").classList.add("acik");
}

/* ---- olaylar ---- */
$("btn-baslat").addEventListener("click", ()=>{
  try{ sesCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  const g = $("giris");
  g.classList.add("kapanan");
  setTimeout(()=>{ g.remove(); ses(523.25,.15,"triangle"); }, 450);
});
$("madde").addEventListener("change", miktarSecenekleri);
$("btn-ekle").addEventListener("click", ()=> ekle($("madde").value, parseFloat($("miktar").value)));
$("belirtec").addEventListener("change", e=>{
  belirtec = e.target.value;
  const pH = pHHesapla();
  const b = belirtecRengi(pH);
  if(belirtec === "yok") ekraniYaz("Belirteç çıkarıldı","Çözelti kendi rengine döndü.",false);
  else if(pH === null) ekraniYaz(`${e.target.selectedOptions[0].text} eklendi`,"Renk görmek için önce behere sıvı ekle.",false);
  else ekraniYaz(`${e.target.selectedOptions[0].text} · ${b.ad}`,
       `pH ${pH.toFixed(2)} olan çözeltide belirteç ${b.ad} renk aldı.`,false);
});
$("btn-kapak").addEventListener("click", ()=>{ kapakKapali=!kapakKapali; ses(400,.05); dugmeleriYaz(); });
$("btn-bek").addEventListener("click", ()=>{ bekAcik=!bekAcik; ses(bekAcik?700:300,.08,"triangle"); dugmeleriYaz(); });
$("btn-temizle").addEventListener("click", ()=>{
  sifirla(); dugmeleriYaz(); gostergeleriYaz();
  ekraniYaz("Reaktif bekleniyor","Beher boşaltıldı. Behere önce su ekleyerek başla.",false);
  ses(180,.12);
});
$("btn-tema").addEventListener("click", ()=>{ temaUygula(!aydinlik); ses(aydinlik?660:440,.07,"triangle"); });
$("btn-kayit").addEventListener("click", kayitlariGoster);
$("btn-kapat").addEventListener("click", ()=> $("kayit-katman").classList.remove("acik"));
$("btn-yazdir").addEventListener("click", ()=> window.print());

/* ---- başlat ---- */
sifirla();
belirtec = "yok";
temaUygula(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
miktarSecenekleri();
dugmeleriYaz();
gostergeleriYaz();
ciz();
</script>
</body>
</html>
